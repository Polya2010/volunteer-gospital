{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="border-left-color: var(--accent);">
    <h2>Регистрация</h2>
    <form method="post">
        <p><label>Логин</label><input name="username" required></p>
        <p><label>Пароль</label><input type="password" name="password" required></p>
        <p>
            <label>Кто вы?</label>
            <select name="role">
                <option value="patient">Пациент — нужна помощь</option>
                <option value="volunteer">Волонтёр — хочу помочь</option>
            </select>
        </p>
        <button class="btn" type="submit">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
